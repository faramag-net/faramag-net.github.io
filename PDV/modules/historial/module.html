<section class="history">

    <header class="module-header">

        <h1>Historial</h1>

        <p>
            Consulta básica de ventas y movimientos.
        </p>

    </header>

    <main class="module-content history-layout">

        <section class="card">

            <header class="card-header">

                <h2>Ventas</h2>

            </header>

            <div class="table-container">

                <table id="historyTransactionsTable">

                    <thead>

                        <tr>
                            <th>Venta</th>
                            <th>Fecha</th>
                            <th>Total</th>
                            <th>Estado</th>
                        </tr>

                    </thead>

                    <tbody id="historyTransactionsBody">
                    </tbody>

                </table>

            </div>

        </section>

        <section class="card">

            <header class="card-header">

                <h2>Movimientos</h2>

            </header>

            <div class="table-container">

                <table id="historyMovementsTable">

                    <thead>

                        <tr>
                            <th>Fecha</th>
                            <th>Tipo</th>
                            <th>Artículo</th>
                            <th>Cantidad</th>
                            <th>Referencia</th>
                        </tr>

                    </thead>

                    <tbody id="historyMovementsBody">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

</section>
