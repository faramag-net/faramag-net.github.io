<section class="tickets">

    <header class="module-header">

        <h1>Tickets</h1>

        <p>
            Consulta y visualización de tickets virtuales.
        </p>

    </header>

    <main class="module-content tickets-layout">

        <section class="card ticket-selector-card">

            <header class="card-header">

                <h2>Venta</h2>

            </header>

            <div class="field">

                <label for="ticketSale">
                    Seleccionar venta
                </label>

                <select id="ticketSale">
                </select>

            </div>

        </section>

        <section class="card ticket-preview-card">

            <header class="card-header">

                <h2>Ticket virtual</h2>

            </header>

            <div id="ticketPreview" class="ticket-preview">
            </div>

        </section>

    </main>

</section>
