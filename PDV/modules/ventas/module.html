<section class="sales">

    <header class="module-header">

        <h1>Ventas</h1>

        <p>
            Registro de ventas y consulta del historial.
        </p>

    </header>

    <main class="module-content sales-layout">

        <section class="card">

            <header class="card-header">

                <h2>Nueva venta</h2>

            </header>

            <div class="form-grid sales-form">

                <div class="field">

                    <label for="saleArticle">
                        Artículo
                    </label>

                    <select id="saleArticle">
                    </select>

                </div>

                <div class="field">

                    <label for="saleQuantity">
                        Cantidad
                    </label>

                    <input
                        id="saleQuantity"
                        type="number"
                        min="0.01"
                        step="0.01"
                        value="1">

                </div>

                <div class="field sales-form-action">

                    <button
                        id="btnAddToCart"
                        type="button">

                        Agregar al carrito

                    </button>

                </div>

            </div>

        </section>

        <section class="card">

            <header class="card-header sales-cart-header">

                <h2>Carrito</h2>

                <strong id="saleTotal">
                    $0.00
                </strong>

            </header>

            <div class="table-container">

                <table id="saleCartTable">

                    <thead>

                        <tr>

                            <th>Artículo</th>
                            <th>Cantidad</th>
                            <th>Precio</th>
                            <th>Total</th>
                            <th></th>

                        </tr>

                    </thead>

                    <tbody id="saleCartTableBody">
                    </tbody>

                </table>

            </div>

            <footer class="form-actions">

                <button
                    id="btnCompleteSale"
                    type="button">

                    Cobrar

                </button>

            </footer>

        </section>

        <section class="card">

            <header class="card-header">

                <h2>Historial de ventas</h2>

            </header>

            <div class="table-container">

                <table id="salesHistoryTable">

                    <thead>

                        <tr>

                            <th>Fecha</th>
                            <th>Venta</th>
                            <th>Artículos</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th>Acciones</th>

                        </tr>

                    </thead>

                    <tbody id="salesHistoryTableBody">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

</section>
