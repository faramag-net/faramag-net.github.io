<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet"
          href="./styles.css">
    
    <link
    rel="stylesheet"
    href="./styles/global.css">

    <link
    rel="stylesheet"
    href="./components/navbar.css">

</head>

<body>

    <div id="navbar"></div>

    <div class="container">
        
    <h1>Dashboard</h1>

    <section class="app-version-panel" aria-label="Versión de la aplicación">
        <div class="app-version-title">⚙️ Información de la aplicación</div>
        <div class="app-version-values">
            <div><span>VERSION:</span><strong id="appVersion">—</strong></div>
            <div><span>BUILD:</span><strong id="appBuild">—</strong></div>
        </div>
    </section>

    <div class="dashboard">

        <div class="card">
            <h3>Ventas</h3>
            <p id="kpiVentas">0</p>
        </div>

        <div class="card">
            <h3>Ganancia</h3>
            <p id="kpiGanancia">0</p>
        </div>

        <div class="card">
            <h3>Productos</h3>
            <p id="kpiProductos">0</p>
        </div>

        <div class="card">
            <h3>Stock Bajo</h3>
            <p id="kpiStock">0</p>
        </div>

        <div class="card">
            <h3>Valor Inventario</h3>
            <p id="kpiInventario">$0</p>
        </div>

        <div class="card">

            <h3>📦 Piezas</h3>
        
            <p id="kpiPiezas">
                0
            </p>
        
        </div>

        <div class="card">

            <h3>🛒 Insumos</h3>
        
            <p id="kpiInsumos">
                $0
            </p>
        
        </div>

    </div>


    <section class="backup-panel">
        <h2>💾 Respaldos</h2>
        <p>Datos y fotografías se respaldan por separado.</p>
        <div class="backup-actions">
            <button id="backupDataExport" type="button">⬇️ Exportar datos</button>
            <button id="backupDataImport" type="button">⬆️ Importar datos</button>
            <button id="marketSyncExport" type="button">🔄 Exportar Mercado para sincronizar</button>
            <button id="marketSyncImport" type="button">🔄 Sincronizar Mercado</button>
            <input id="marketSyncFile" type="file" accept=".json,.psr.json" hidden>
            <input id="backupDataFile" type="file" accept=".json,.psr.json" hidden>
            <button id="backupPhotoExport" type="button">📷 Exportar fotos</button>
            <button id="backupPhotoImport" type="button">📷 Importar fotos</button>
            <input id="backupPhotoFile" type="file" accept=".json,.psr.json" hidden>
        </div>
    </section>

    <section class="top-clientes-dashboard">
        <div class="top-clientes-header">
            <h3>👥 Top clientes</h3>
            <span id="topClientesPaginaInfo">1-10</span>
        </div>
        <div id="topClientesLista" class="top-clientes-lista"></div>
        <div class="top-clientes-paginacion">
            <button id="topClientesAnterior" type="button" aria-label="Página anterior">‹</button>
            <span id="topClientesPagina">1 / 1</span>
            <button id="topClientesSiguiente" type="button" aria-label="Página siguiente">›</button>
        </div>
    </section>

    <script type="module">

    import {
        crearNavbar
    }
    from "./components/navbar.js";
        
    document
        .getElementById("navbar")
        .innerHTML =
        crearNavbar();

    </script>
        
    <script type="module">
        import { APP_VERSION, APP_BUILD } from "./core/app-version.js";
        document.getElementById("appVersion").textContent = APP_VERSION;
        document.getElementById("appBuild").textContent = APP_BUILD;
    </script>
    <script type="module" src="./dashboard.js"></script>
    <script type="module">
        import { bindBackupUI } from "./core/backup/backup.js";
        bindBackupUI();
    </script>

</body>

</html>
